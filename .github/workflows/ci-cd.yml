name: CI/CD
on:
  pull_request: {}
  push:
    branches:
      - main
    tags:
      - v*.*.*
jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Read .tool-versions
        id: versions
        uses: marocchino/tool-versions-action@v1
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: ${{ steps.versions.outputs.pnpm }}
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: make typecheck

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Read .tool-versions
        id: versions
        uses: marocchino/tool-versions-action@v1
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: ${{ steps.versions.outputs.pnpm }}
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: make formatting

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Read .tool-versions
        id: versions
        uses: marocchino/tool-versions-action@v1
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: ${{ steps.versions.outputs.pnpm }}
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: make lint

  bundle:
    name: Bundle
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Read .tool-versions
        id: versions
        uses: marocchino/tool-versions-action@v1
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: ${{ steps.versions.outputs.pnpm }}
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set version
        if: startsWith(github.ref, 'refs/tags/')
        run: make version VERSION="${GITHUB_REF:11}"
      - name: Build app
        run: make app
      - name: Collect disk images
        run: |
          mkdir -p bundle
          find src-tauri/target -path '*/release/bundle/dmg/*.dmg' -exec cp {} bundle/ \;
          ls -lh bundle/*.dmg
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle/*.dmg
          if-no-files-found: error

  release:
    name: Release
    needs:
      - typecheck
      - formatting
      - lint
      - bundle
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Download app
        uses: actions/download-artifact@v4
        with:
          name: bundle
          path: bundle
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: bundle/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
